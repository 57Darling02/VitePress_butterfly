name: Release Template

on:
  push:

permissions:
  contents: write

jobs:
  release:
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Verify plugin version matches tag
        run: |
          TAG="${GITHUB_REF_NAME#v}"
          VERSION="$(node -p "require('./template/.obsidian/plugins/vitepress-butterfly-publisher/manifest.json').version")"
          if [ "$TAG" != "$VERSION" ]; then
            echo "::error::Tag $GITHUB_REF_NAME does not match plugin manifest version $VERSION"
            exit 1
          fi
          echo "::notice::Tag is v$VERSION, release OK."

      - name: Package vault template
        run: |
          cd template
          zip -r ../vitepress-butterfly-wiki.zip . \
            -x ".obsidian/plugins/vitepress-butterfly-publisher/src/*" \
            -x ".obsidian/plugins/vitepress-butterfly-publisher/package.json" \
            -x ".obsidian/plugins/vitepress-butterfly-publisher/pnpm-lock.yaml" \
            -x ".obsidian/plugins/vitepress-butterfly-publisher/esbuild.config.mjs" \
            -x ".obsidian/plugins/vitepress-butterfly-publisher/tsconfig.json"
          cd ..

      - name: Create release
        env:
          GH_TOKEN: ${{ github.token }}
        run: >
          gh release create "$GITHUB_REF_NAME"
          vitepress-butterfly-wiki.zip
          template/.obsidian/plugins/vitepress-butterfly-publisher/main.js
          template/.obsidian/plugins/vitepress-butterfly-publisher/styles.css
          template/.obsidian/plugins/vitepress-butterfly-publisher/manifest.json
          --generate-notes
          --title "$GITHUB_REF_NAME"
