name: Deploy Site

on:
  push:
    branches: [main]
  workflow_dispatch:
  repository_dispatch:
    types: [contents-updated]

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  # The template-generated initial commit is bootstrap-only. Keeping it out of
  # the normal group prevents it from cancelling the publisher's final dispatch.
  group: ${{ github.event_name == 'push' && (github.event.created || github.event.before == '0000000000000000000000000000000000000000') && 'site-bootstrap' || 'site-deploy' }}
  cancel-in-progress: true

env:
  VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
  VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}

jobs:
  readiness:
    runs-on: ubuntu-latest
    outputs:
      deploy: ${{ steps.check.outputs.deploy }}
    steps:
      - name: Check deployment readiness
        id: check
        env:
          BOOTSTRAP_PUSH: ${{ github.event_name == 'push' && (github.event.created || github.event.before == '0000000000000000000000000000000000000000') }}
          WIKI_URL: ${{ secrets.WIKI_URL }}
          PAT: ${{ secrets.PAT }}
        run: |
          if [ "$BOOTSTRAP_PUSH" = "true" ]; then
            echo "::notice::Template bootstrap commit detected; waiting for publisher configuration."
            exit 0
          fi

          if [ -z "$WIKI_URL" ] || [ -z "$PAT" ]; then
            echo "::notice::Blog setup is incomplete; waiting for WIKI_URL and PAT."
            exit 0
          fi

          wiki_url="${WIKI_URL%/}"
          if [[ ! "$wiki_url" =~ ^https://github\.com/([A-Za-z0-9_.-]+)/([A-Za-z0-9_.-]+)(\.git)?$ ]]; then
            echo "::warning::WIKI_URL is not a supported GitHub HTTPS URL; skipping this deployment."
            exit 0
          fi

          owner="${BASH_REMATCH[1]}"
          repository="${BASH_REMATCH[2]%.git}"
          status="000"
          for attempt in {1..5}; do
            status="$(curl --silent --show-error --connect-timeout 5 --max-time 15 \
              --output /dev/null --write-out '%{http_code}' \
              --header 'Accept: application/vnd.github+json' \
              --header "Authorization: Bearer $PAT" \
              --header 'X-GitHub-Api-Version: 2022-11-28' \
              "https://api.github.com/repos/$owner/$repository/git/ref/heads/main" || true)"
            if [ "$status" = "200" ]; then
              echo "deploy=true" >> "$GITHUB_OUTPUT"
              exit 0
            fi
            if [ "$attempt" -lt 5 ]; then
              sleep 2
            fi
          done

          if [ "$status" = "404" ]; then
            echo "::notice::Article repository $owner/$repository is not ready yet; skipping this deployment."
          else
            echo "::warning::Cannot verify article repository $owner/$repository (HTTP $status); check PAT access or network."
          fi

  build:
    needs: readiness
    if: needs.readiness.outputs.deploy == 'true'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Install pnpm
        uses: pnpm/action-setup@v3
        with:
          version: 9.15.0

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build with VitePress
        env:
          WIKI_URL: ${{ secrets.WIKI_URL }}
          PAT: ${{ secrets.PAT }}
        run: pnpm docs:build

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: .vitepress/dist

      - name: Upload reusable site artifact
        uses: actions/upload-artifact@v4
        with:
          name: site-dist
          path: .vitepress/dist
          retention-days: 7

  deploy-pages:
    name: Deploy GitHub Pages
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4

  deploy-vercel:
    name: Deploy Vercel (optional)
    needs: build
    runs-on: ubuntu-latest
    steps:
      - name: Check Vercel config
        id: vercel-check
        run: |
          if [ -n "${{ secrets.VERCEL_TOKEN }}" ] && [ -n "${{ secrets.VERCEL_ORG_ID }}" ] && [ -n "${{ secrets.VERCEL_PROJECT_ID }}" ]; then
            echo "enabled=true" >> "$GITHUB_OUTPUT"
          else
            echo "enabled=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Skip Vercel deploy (missing config)
        if: steps.vercel-check.outputs.enabled != 'true'
        run: echo "Skip Vercel deploy because VERCEL_TOKEN / VERCEL_ORG_ID / VERCEL_PROJECT_ID is not fully configured."

      - name: Download built site artifact
        if: steps.vercel-check.outputs.enabled == 'true'
        uses: actions/download-artifact@v4
        with:
          name: site-dist
          path: .site-dist

      - name: Setup Node
        if: steps.vercel-check.outputs.enabled == 'true'
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install Vercel CLI
        if: steps.vercel-check.outputs.enabled == 'true'
        run: npm install -g vercel@latest

      - name: Deploy static build to Vercel
        if: steps.vercel-check.outputs.enabled == 'true'
        run: |
          TARGET_DIR=".site-dist"
          if [ -d ".site-dist/dist" ]; then
            TARGET_DIR=".site-dist/dist"
          fi
          vercel deploy --prod --yes --token=${{ secrets.VERCEL_TOKEN }} "$TARGET_DIR"
